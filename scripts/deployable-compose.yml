services:
  frontend:
    image: ${CI_REGISTRY_IMAGE/frontend}:
    networks:
      - traefik-public
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.constraint-label=traefik-public"
        - "traefik.swarm.network=traefik-public"

        - "traefik.http.routers.name-http.rule=Host(`.doe25.swarm.chas-lab.dev`)"
        - "traefik.http.routers.name-http.entrypoints=http"
        - "traefik.http.routers.name-http.middlewares=https-redirect"

        - "traefik.http.routers.name-https.rule=Host(`.doe25.swarm.chas-lab.dev`)"
        - "traefik.http.routers.name-https.entrypoints=https"
        - "traefik.http.routers.name-https.tls=true"
        - "traefik.http.routers.name-https.tls.certresolver=le"

        - "traefik.http.services.name.loadbalancer.server.port=5173"

  backend:
    image: ${CI_REGISTRY_IMAGE/backend}:
    networks:
      - traefik-public
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.constraint-label=traefik-public"
        - "traefik.swarm.network=traefik-public"

        - "traefik.http.routers.name-http.rule=Host(`.doe25.swarm.chas-lab.dev`)"
        - "traefik.http.routers.name-http.entrypoints=http"
        - "traefik.http.routers.name-http.middlewares=https-redirect"

        - "traefik.http.routers.name-https.rule=Host(`.doe25.swarm.chas-lab.dev`)"
        - "traefik.http.routers.name-https.entrypoints=https"
        - "traefik.http.routers.name-https.tls=true"
        - "traefik.http.routers.name-https.tls.certresolver=le"

        - "traefik.http.services.name.loadbalancer.server.port=3000"


networks:
  traefik-public:
    external: true

