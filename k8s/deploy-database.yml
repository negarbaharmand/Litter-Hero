apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: doe25-alexander-piensoho
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  serviceName: "litter-hero-db"
  template:
    metadata:
      labels:
        app: database
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: database
          image: imresamu/postgis:18-3.6-alpine
          ports:
            - containerPort: 5432
              name: connect
          envFrom:
            - secretRef:
                name: database-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: app-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: app-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "longhorn"
        resources:
          requests:
            storage: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: litter-hero-db
  namespace: doe25-alexander-piensoho
spec:
  selector:
    app: database
  clusterIP: None
