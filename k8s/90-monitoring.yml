apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litter-hero-backend
  labels:
    release: monitoring # This label must be there!
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: litter-hero-monitoring
  labels:
    release: monitoring # This needs to be there!
spec:
  groups:
    - name: litter-hero-monitoring.rules
      rules:
        - alert: TestRestApiHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="doe25-group-2",status=~"5..",handler!="/metrics"}[5m]))
              /
            sum(rate(http_requests_total{namespace="doe25-group-2",handler!="/metrics"}[5m]))
              > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "backend service 5xx rate above 5% (5m)"
            description: "More than 5% of requests are returning 5xx for the last 5 minutes."
        - alert: TestRestApiNoTraffic
          expr: |
            sum(rate(http_requests_total{namespace="doe25-group-2",handler!="/metrics"}[10m])) == 0
          for: 15m
          labels:
            severity: info
          annotations:
            summary: "backend has received no traffic for 15m"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-dashboard
  labels:
    grafana_dashboard: "1" # This needs to be there!
data:
  test-rest-api.json: |
    {
      "title": "litter-hero-backend",
      "uid": "litter-hero-backend",
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "tags": ["chas-academy", "doe25"],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(http_requests_total, namespace)",
            "current": { "text": "doe25-group-2", "value": "doe25-group-2" },
            "refresh": 1,
            "includeAll": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request rate (req/s) by handler",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum by (handler) (rate(http_requests_total{namespace=\"$namespace\",handler!=\"/metrics\"}[1m]))",
              "legendFormat": "{{handler}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error rate (5xx, share of total)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"$namespace\",status=~\"5..\",handler!=\"/metrics\"}[5m])) / clamp_min(sum(rate(http_requests_total{namespace=\"$namespace\",handler!=\"/metrics\"}[5m])), 1)",
              "legendFormat": "5xx ratio",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0 } }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latency p95 (s) by handler",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (handler, le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\",handler!=\"/metrics\"}[5m])))",
              "legendFormat": "{{handler}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Requests last 5m by status",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "sum by (status) (increase(http_requests_total{namespace=\"$namespace\",handler!=\"/metrics\"}[5m]))",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
